<section id="services" class="services">
    <div class="container">
      <header class="section-header">
        <h2>Our Services</h2>
        <p>Solutions tailored to grow your business.</p>
      </header>
      <div class="services__grid">
        {% for service in site.data.services %}
        <article class="service">
          <img src="{{ '/assets/images/' | append: service.image | relative_url }}" alt="{{ service.title }}" loading="lazy">
          <h3>{{ service.title }}</h3>
          <p>{{ service.description }}</p>
        </article>
        {% endfor %}
      </div>
    </div>
  </section>
